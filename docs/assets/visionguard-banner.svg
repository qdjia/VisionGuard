<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">VisionGuard 本地多模态出版内容智能审校</title>
  <desc id="desc">视觉检测、文字识别与语义分析构成本地 AI 审核链路。</desc>
  <defs>
    <clipPath id="corners"><rect width="1200" height="300" rx="24"/></clipPath>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1120" cy="20" r="170" fill="#2563eb" opacity="0.12" clip-path="url(#corners)"/>
  <circle cx="1020" cy="310" r="180" fill="#7c3aed" opacity="0.1" clip-path="url(#corners)"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="52" y="48" width="58" height="58" rx="16" fill="url(#accent)"/>
    <path d="M68 65 L81 90 L95 65" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="88" fill="#f8fafc" font-size="38" font-weight="700">VisionGuard</text>
    <text x="54" y="158" fill="#f8fafc" font-size="28" font-weight="600">让视觉、文字与语义共同成为审核证据</text>
    <text x="54" y="196" fill="#cbd5e1" font-size="18">多模态出版内容智能审校 · 本地 AI 推理 · 可解释的结构化结果</text>
    <text x="54" y="256" fill="#93c5fd" font-size="14" letter-spacing="2">DETECT · READ · REASON · REVIEW</text>
    <g transform="translate(790 70)">
      <rect width="340" height="48" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="16" y="16" width="16" height="16" rx="4" fill="#60a5fa"/>
      <text x="48" y="31" fill="#e2e8f0" font-size="17">视觉检测 / Detection</text>
      <path d="M170 52 v14" stroke="#64748b" stroke-width="2"/>
      <rect y="70" width="340" height="48" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="16" y="86" width="16" height="16" rx="4" fill="#34d399"/>
      <text x="48" y="101" fill="#e2e8f0" font-size="17">文字识别 / OCR</text>
      <path d="M170 122 v14" stroke="#64748b" stroke-width="2"/>
      <rect y="140" width="340" height="48" rx="12" fill="#1e293b" stroke="#334155"/>
      <rect x="16" y="156" width="16" height="16" rx="4" fill="#a78bfa"/>
      <text x="48" y="171" fill="#e2e8f0" font-size="17">语义分析 / Local VLM</text>
    </g>
  </g>
</svg>
