[package]
name = "visionguard-desktop"
version = "1.0.0"
description = "VisionGuard desktop shell"
authors = ["VisionGuard contributors"]
edition = "2021"
license = "AGPL-3.0-only"
homepage = "https://github.com/qdjia/VisionGuard"

[lib]
name = "visionguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-http = "=2.6.1"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
