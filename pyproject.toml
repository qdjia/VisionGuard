[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard-moderation"
version = "0.1.0"
description = "Multimodal publishing content moderation research pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.57,<5",
    "accelerate>=1,<2",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr>=3.7,<4",
    "paddlepaddle>=3.2,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "torch>=2.2",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires local model weights and inference dependencies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
