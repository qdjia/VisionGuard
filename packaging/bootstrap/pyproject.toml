[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard-moderation"
version = "0.1.0"
description = "VisionGuard isolated Advanced AI runtime"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
visionguard-vlm-runtime = "visionguard.vlm_runtime.main:main"

[tool.setuptools.packages.find]
where = ["src"]
