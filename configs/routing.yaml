routing:
  version: routing_v3
  conservative_mode: true
  baseline:
    safe_threshold: 0.10
    risky_threshold: 0.80
  detector:
    high_risk_conf_threshold: 0.65
    suspicious_conf_threshold: 0.30
  ocr:
    min_mean_confidence: 0.60
    min_text_length: 3
    min_fast_path_text_area_ratio: 0.12
    min_fast_path_block_count: 4
    min_fast_path_text_length: 32
  high_risk_classes:
    - weapon
    - violence
    - blood
    - prohibited_symbol
  failure:
    route_to_vlm: true
