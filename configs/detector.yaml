# Standalone detector entry point. Kept as a complete AppConfig so every CLI
# uses the same validated configuration contract.
project:
  name: visionguard-detector
  environment: development
  artifacts_dir: ../artifacts
  checkpoints_dir: ../checkpoints

detection:
  classes_file: classes.yaml
  model_path: ../checkpoints/yolo26.pt
  device: auto
  conf_threshold: 0.25
  iou_threshold: 0.45
  max_det: 300
  image_size: 640
  half_precision: true
  warmup_enabled: true
  warmup_runs: 1
  class_name_mapping: {}

ocr:
  language: ch
  use_angle_cls: true
  min_confidence: 0.5
  enable_roi_ocr: true

vlm:
  provider: mock
  model: placeholder
  timeout_seconds: 30.0
  max_retries: 2

cascade:
  enabled: true
  high_confidence_threshold: 0.85
  low_confidence_threshold: 0.4
  call_vlm_on_conflict: true
