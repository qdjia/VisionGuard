name: Windows Release Smoke

on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: HTTPS URL of the exact VisionGuard NSIS candidate
        required: true
        type: string
      candidate_sha256:
        description: Expected lowercase SHA-256 of the candidate
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/windows-release-smoke.yml"
      - "scripts/run_windows_acceptance.py"
      - "scripts/run_windows_core_acceptance.py"
      - "scripts/validate_release.py"
      - "tests/test_windows_acceptance.py"
      - "tests/test_release_validation.py"

permissions:
  contents: read

jobs:
  acceptance-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Record runner environment
        shell: pwsh
        run: |
          $PSVersionTable
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - name: Install contract-test dependency
        run: python -m pip install pytest==8.4.2
      - name: Validate split acceptance contracts
        run: python -m pytest -q tests/test_windows_acceptance.py tests/test_release_validation.py

  clean-core-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: acceptance-contract
    runs-on: windows-latest
    env:
      CANDIDATE_URL: ${{ inputs.candidate_url }}
      CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and verify candidate
        shell: pwsh
        run: |
          $uri = [Uri]$env:CANDIDATE_URL
          if ($uri.Scheme -ne "https") { throw "candidate_url must use HTTPS" }
          if ($env:CANDIDATE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw "invalid SHA-256" }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\visionguard-candidate" | Out-Null
          $target = "$env:RUNNER_TEMP\visionguard-candidate\VisionGuard-Setup.exe"
          Invoke-WebRequest -Uri $uri -OutFile $target
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CANDIDATE_SHA256.ToLowerInvariant()) { throw "candidate SHA-256 mismatch" }
      - name: Run packaged Core acceptance
        shell: pwsh
        run: |
          python scripts/run_windows_core_acceptance.py `
            --installer "$env:RUNNER_TEMP\visionguard-candidate\VisionGuard-Setup.exe" `
            --expected-sha256 "$env:CANDIDATE_SHA256" `
            --output-dir "$env:RUNNER_TEMP\visionguard-core-evidence"
      - name: Upload small acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-acceptance
          path: |
            ${{ runner.temp }}/visionguard-core-evidence/windows-core-acceptance.json
            ${{ runner.temp }}/visionguard-core-evidence/windows-core-acceptance.log
          if-no-files-found: error
          retention-days: 14

